name: Seeded E2E

on:
  pull_request:
    paths:
      - "src/app/assess/**"
      - "src/app/actions/assess.ts"
      - "src/components/assess/**"
      - "src/lib/assess/**"
      - "tests/e2e/seeded/**"
      - ".github/workflows/e2e-seeded.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1"

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seeded-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        # Wrapper, not `supabase start`: Docker Hub rate-limits anonymous pulls
        # and the CLI still exits 0 with containers missing, which surfaces
        # later as auth failures in the tests. See the script's header.
        run: npm run db:test:start:ci

      - name: Reset local Supabase database
        run: npm run db:test:reset

      - name: Export local Supabase environment
        # --silent suppresses npm's "> trajectas@0.1.0 db:test:env" banner,
        # which is not KEY=VALUE and makes GITHUB_ENV parsing fail.
        #
        # `supabase status -o env` emits API_URL / ANON_KEY / SERVICE_ROLE_KEY,
        # but the app reads NEXT_PUBLIC_SUPABASE_URL /
        # NEXT_PUBLIC_SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY. Without
        # the alias the dev server silently starts on the placeholder values in
        # scripts/testing/run-next-dev-test.mjs, every authenticated page throws
        # AuthenticationRequiredError, and the error reporter says "Expected 3
        # parts in JWT; got 1" — which reads like a broken session rather than a
        # missing variable. run-next-dev-test.mjs cannot fill the gap itself: it
        # skips its own `supabase status` lookup when CI is set.
        run: |
          ENV_OUTPUT="$(npm run --silent db:test:env)"
          echo "$ENV_OUTPUT" >> "$GITHUB_ENV"
          value() { echo "$ENV_OUTPUT" | sed -n "s/^$1=\"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p"; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(value API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(value ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(value SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run seeded Playwright suite
        run: npm run test:e2e:seeded

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-seeded
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: npm run db:test:stop
