name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    runs-on: ubuntu-latest
    # 20 rather than 15: the audit step now retries a slow registry instead of
    # failing on it, and its worst case is ~11 minutes of attempts and backoff.
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Node 20 bundles npm 10, which asks the bulk advisory endpoint first and
      # then silently falls back to /-/npm/v1/security/audits/quick — retired,
      # and answers 400 "Invalid package tree", which reads as a lockfile bug
      # when it is really a network one. npm 11 dropped the fallback. Pinned
      # rather than floating so the audit's behaviour does not drift under us.
      # Best-effort: if the pin cannot be fetched the audit still runs, and the
      # wrapper below classifies the quick endpoint's answers as transport too.
      - name: Pin npm 11 for the audit
        continue-on-error: true
        run: npm install -g npm@11.19.1

      # Wraps `npm audit --omit=dev --audit-level=high`. Same threshold — the
      # wrapper exists to tell a high-severity advisory (fail) apart from an
      # unreachable registry (retry, then warn), which npm's exit code alone
      # cannot. See the script header and AGENTS.md.
      - name: Audit production dependencies
        run: node scripts/audit-production-deps.mjs

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Use Python 3.12 for statistical verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify statistical engine
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests/outcomes -v

      - name: Run Vitest coverage suite
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Check bundle budgets
        run: node scripts/check-bundle-budgets.mjs

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        # Wrapper, not `supabase start`: Docker Hub rate-limits anonymous pulls
        # and the CLI still exits 0 with containers missing, which surfaces
        # later as auth failures in the tests. See the script's header.
        run: npm run db:test:start:ci

      - name: Reset local Supabase database
        run: npm run db:test:reset

      # Runs tests/integration against the LOCAL stack. The runner maps the
      # local Supabase env onto the NEXT_PUBLIC_* names the tests expect, and
      # each file's isLocalSupabase guard keeps it from ever touching prod.
      # These tests skip in the `quality` job (no Supabase env there); this is
      # the job that gives them real signal.
      - name: Run integration tests against local Supabase
        run: npm run test:integration:local

      - name: Stop local Supabase stack
        if: always()
        run: npm run db:test:stop

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke suite
        run: npm run test:e2e:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
