name: Seeded E2E

on:
  pull_request:
    paths:
      - "src/app/assess/**"
      - "src/app/actions/assess.ts"
      - "src/components/assess/**"
      - "src/lib/assess/**"
      - "tests/e2e/seeded/**"
      - ".github/workflows/e2e-seeded.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1"

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seeded-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        run: npm run db:test:start

      - name: Reset local Supabase database
        run: npm run db:test:reset

      - name: Export local Supabase environment
        # --silent suppresses npm's "> trajectas@0.1.0 db:test:env" banner,
        # which is not KEY=VALUE and makes GITHUB_ENV parsing fail.
        run: npm run --silent db:test:env >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run seeded Playwright suite
        run: npm run test:e2e:seeded

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-seeded
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: npm run db:test:stop
